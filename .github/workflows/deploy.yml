# Build checks on every push and pull request; deploy to GitHub Pages only from main.
name: Build and deploy

on:
  push:
    branches: [main, "draft/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy from main midway; superseded draft/PR checks can go.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  HUGO_VERSION: 0.169.0   # pinned; change only with a note in the PR (see README)
  LYCHEE_VERSION: 0.24.2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo extended ${{ env.HUGO_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep "  $tarball\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" hugo
          sudo install -m755 hugo /usr/local/bin/hugo
          hugo version

      - name: Install lychee ${{ env.LYCHEE_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          tarball="lychee-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/$tarball.sha256"
          echo "$(cut -d' ' -f1 "$tarball.sha256")  $tarball" | sha256sum -c -
          mkdir lychee && tar -xzf "$tarball" -C lychee
          sudo install -m755 "$(find lychee -type f -name lychee)" /usr/local/bin/lychee
          lychee --version

      - name: Build and check
        run: make check

      - name: Upload site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
